<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналізатор курсу валют</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" defer></script>

    <script src="model.js" defer></script>
    <script src="view.js" defer></script>
    <script src="controller.js" defer></script>
</head>

<body class="bg-light">
    <main class="container py-4">
        <h1 class="text-center mb-4">Аналізатор курсу валют</h1>

        <form id="currency-form">
            <fieldset class="border rounded bg-white p-3">
                <legend class="float-none w-auto px-2 fs-5">
                    Параметри
                </legend>

                <div class="row g-3 align-items-end">
                    <div class="col-12 col-md-3">
                        <label for="currency" class="form-label">
                            Валюта
                        </label>
                        <select id="currency" class="form-select">
                            <option value="USD">USD — долар США</option>
                            <option value="EUR">EUR — євро</option>
                            <option value="GBP">GBP — фунт стерлінгів</option>
                            <option value="PLN">PLN — польський злотий</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-3">
                        <label for="start-date" class="form-label">
                            Початкова дата
                        </label>
                        <input type="date" id="start-date" class="form-control" value="2022-01-15" required>
                    </div>

                    <div class="col-12 col-md-3">
                        <label for="end-date" class="form-label">
                            Кінцева дата
                        </label>
                        <input type="date" id="end-date" class="form-control" value="2022-01-31" required>
                    </div>

                    <div class="col-12 col-md-3 d-flex gap-2">
                        <button type="submit" name="display" value="table" class="btn btn-outline-primary">
                            Table
                        </button>

                        <button type="submit" name="display" value="chart" class="btn btn-primary">
                            Chart
                        </button>
                    </div>
                </div>
            </fieldset>
        </form>

        <p id="message" class="mt-3" role="status" aria-live="polite">
            Оберіть валюту та період, потім натисніть Chart або Table.
        </p>

        <section id="chart-section" class="bg-white rounded p-3" hidden>
            <h2 id="chart-title" class="text-center fs-5"></h2>
            <p class="text-center text-muted small">
                Джерело: Національний банк України
            </p>

            <div class="position-relative" style="height: 400px;">
                <canvas id="rates-chart" role="img" aria-label="Графік курсу обраної валюти до гривні"></canvas>
            </div>
        </section>

        <section id="table-section" class="table-responsive" hidden>
            <table class="table table-bordered table-striped bg-white">
                <caption>Офіційний курс НБУ за обраний період</caption>
                <thead>
                    <tr>
                        <th scope="col">Дата</th>
                        <th scope="col">Валюта</th>
                        <th scope="col">Курс за 1 одиницю, грн</th>
                    </tr>
                </thead>
                <tbody id="rates-table-body"></tbody>
            </table>
        </section>
    </main>
</body>

</html>
