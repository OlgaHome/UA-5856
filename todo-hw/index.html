<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <h1 class="text-center mb-4">ToDo List</h1>

                <form id="task-form">
                    <div class="input-group">
                        <input type="text" id="task-input" class="form-control" placeholder="Введіть завдання"
                            aria-label="Нове завдання" required>
                        <button type="submit" class="btn btn-primary">
                            ADD
                        </button>
                    </div>
                </form>

                <fieldset class="border rounded p-3 mt-3 bg-white">
                    <legend class="float-none w-auto px-2 fs-5">
                        Мої завдання
                    </legend>

                    <div id="task-list" class="list-group"></div>
                    <p id="empty-message" class="text-muted mb-0">
                        Поки немає завдань. Додайте перше!
                    </p>
                </fieldset>
            </div>
        </div>
    </main>
</body>

</html>
